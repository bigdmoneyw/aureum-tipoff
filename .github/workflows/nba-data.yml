name: NBA Data Snapshot Refresh
on:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh-data.mjs'
      - '.github/workflows/nba-data.yml'
  schedule:
    - cron: '13 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aureum-nba-data-snapshots
  cancel-in-progress: false
jobs:
  refresh-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and save ESPN NBA data
        run: node scripts/refresh-data.mjs
      - name: Publish sourced JSON snapshots
        run: |
          git config user.name "aureum-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data changes"
          else
            git commit -m "data: refresh sourced NBA scoreboards and standings"
            git push origin HEAD:main
          fi
