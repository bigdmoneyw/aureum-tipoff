name: Forecast training archive
on:
  push:
    branches: [main]
    paths: ['scripts/refresh-training-history.mjs','scripts/forecast-advanced.mjs','scripts/train-advanced.mjs','.github/workflows/forecast-history.yml']
  schedule:
    - cron: '41 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forecast-training-history
  cancel-in-progress: false
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/refresh-training-history.mjs
      - run: node scripts/train-advanced.mjs
      - run: |
          git config user.name aureum-data-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/forecast-v2-*.json data/forecast-ledger-*.json data/player-history-*.json
          git add -A data/forecast-history-* 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "data: source historical training games and player participation"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
